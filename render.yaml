services:
  - type: web
    name: genai-rag-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && node Gen-AI/GenAI_Project/create_pdf.js
    startCommand: node Gen-AI/GenAI_Project/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: GEMINI_API_KEY
        sync: false
